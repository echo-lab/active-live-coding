<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Live Coding Lecture</title>
  </head>
  <body id="instructor-interface">
    <div id="app">
      <div class="topbar">
        <div class="topbar-left">
          <h3 id="session-name-display"></h3>
          <!-- <h2>Instructor's Code</h2> -->
        </div>
        <div class="run-button-grid">
          <button id="run-button">▶ ️Run</button>
          <label style="font-size: 0.75rem; display: flex; align-items: center; gap: 0.25rem;">
            <input type="checkbox" id="simulate-responses-checkbox">
            Simulate responses
          </label>
        </div>
        <div class="topbar-right">
          <span id="session-info">
            <span id="session-details"></span>
            <button id="start-session-butt">start</button
            ><button id="end-session-butt" disabled>end</button>
          </span>
        </div>
      </div>
      <div class="parent-container">
        <div id="code-tabs">
          <div id="code-tabs-inner">
            <div class="code-tab selected" id="instructor-code-tab">
              <div class="code-tab-text">instructor.py</div>
            </div>
          </div>
          <button id="open-activities-panel">activities list</button>
        </div>
        <div id="code-container" class="code-container"></div>
        <div id="resize-console"><div class="resize-symbol"></div></div>
        <div id="output-container">
          <div id="all-code-outputs" class="empty">
            Code output will appear here...
          </div>
        </div>
        <div id="resize-activities"></div>
        <div id="activities-container">
          <div id="activities-list">
            <div id="activities-list-header" class="poll-activity-header">
              <span>Activities</span>
              <button id="activities-list-close" class="poll-popover-close" aria-label="Close">×</button>
            </div>
            <div id="activities-list-items"></div>
          </div>
          <div id="activities-poll" hidden></div>
          <div id="activities-code-exercise" hidden></div>
        </div>
      </div>
    </div>
    <div class="modal-background" id="start-session-modal">
      <div class="modal">
        <div>Enter session name</div>
        <div style="font-size: 0.75rem; color: gray;">Enter a unique but memorable name students can use to join your lecture</div>
        <div>
          <input type="text" id="session-name-input" />
        </div>
        <div>
          <button id="start-session-modal-btn">Start</button>
        </div>
        <div id="start-session-error"></div>
      </div>
    </div>
    <script type="module" src="/src/client/instructor.js"></script>
  </body>
</html>
