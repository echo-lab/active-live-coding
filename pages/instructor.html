<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Live Coding Lecture</title>
  </head>
  <body id="instructor-interface">
    <div id="app">
      <div class="topbar">
        <div class="topbar-left">
          <span class="app-logo">AD LIB</span>
          <h3 id="session-name-display"></h3>
          <span id="session-ended-warning" class="session-ended-chip" hidden>Session terminated: future updates not saved</span>
        </div>
        <div class="topbar-right">
          <div class="settings-menu-wrapper">
            <button id="settings-menu-btn" class="settings-menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
            <div id="settings-menu" class="settings-dropdown" hidden>
              <span id="session-details" hidden></span>
              <label class="settings-dropdown-item">
                Simulate responses
                <span class="toggle-switch">
                  <input type="checkbox" id="simulate-responses-checkbox">
                  <span class="toggle-slider"></span>
                </span>
              </label>
              <button id="copy-review-link-btn" class="settings-dropdown-item" hidden>
                <span class="review-link-text">review link</span>
                <svg class="review-link-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>
              <button id="end-session-butt" class="settings-dropdown-item" title="Ending the lecture disables future edits and frees up the lecture ID for future use." disabled>end session</button>
            </div>
          </div>
        </div>
      </div>
      <div class="parent-container">
        <div id="code-tabs">
          <div id="code-tabs-inner">
            <div class="code-tab selected" id="instructor-code-tab">
              <div class="code-tab-text">instructor.py</div>
            </div>
            <div class="code-tab historical-code-tab" id="historical-code-tab" hidden>
              <div class="code-tab-text" id="historical-code-tab-text"></div>
              <button class="historical-code-tab-close" aria-label="Close">×</button>
            </div>
          </div>
          <button id="open-activities-panel">« Activities</button>
        </div>
        <div id="code-container" class="code-container"></div>
        <div id="historical-code-container" class="code-container historical-code-container" hidden>
          <div class="historical-banner">
            <span>Viewing a past version — read only</span>
            <button id="return-to-live-btn">Return to live</button>
          </div>
          <div class="historical-editor-mount"></div>
        </div>
        <div id="resize-console">
          <button id="run-button">▶ ️Run</button>
          <div class="resize-symbol"></div>
        </div>
        <div id="output-container">
          <div id="all-code-outputs" class="empty">
            Code output will appear here...
          </div>
        </div>
        <div id="resize-activities"></div>
        <div id="activities-container">
          <div id="activities-list">
            <div id="activities-list-header" class="poll-activity-header">
              <span>Activities</span>
              <button id="activities-list-close" class="poll-popover-close" aria-label="Close">×</button>
            </div>
            <div id="activities-list-items"></div>
          </div>
          <div id="activities-poll" hidden></div>
          <div id="activities-code-exercise" hidden></div>
        </div>
      </div>
    </div>
    <div class="modal-background" id="start-session-modal">
      <div class="modal">
        <div>Enter session name</div>
        <div style="font-size: 0.75rem; color: gray;">Enter a unique but memorable name students can use to join your lecture</div>
        <div>
          <input type="text" id="session-name-input" />
        </div>
        <div>
          <button id="start-session-modal-btn">Start</button>
        </div>
        <div id="start-session-error"></div>
      </div>
    </div>
    <script type="module" src="/src/client/instructor.js"></script>
  </body>
</html>
